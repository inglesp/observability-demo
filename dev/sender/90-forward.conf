# Forward everything to Alloy over mutual TLS.
#
# This is the dev version of the config the infra repo's log_forwarding role
# templates onto each droplet: there, the target and permitted peer are the
# ingest DNS name, and the cert paths are the role's.

module(load="imfile")

# nginx access logs, in the bytes_json format. Bound straight to the forward
# ruleset, so they aren't also written to the local syslog.
input(
  type="imfile"
  File="/var/log/nginx/*-access.log"
  Tag="nginx-access"
  Severity="info"
  Ruleset="forward"
)

ruleset(name="forward") {
  action(
    type="omfwd"
    target="alloy"
    port="6514"
    protocol="tcp"
    TCP_Framing="octet-counted"
    template="RSYSLOG_SyslogProtocol23Format"

    StreamDriver="gtls"
    StreamDriverMode="1"
    StreamDriverAuthMode="x509/name"
    StreamDriverPermittedPeers="alloy"
    StreamDriver.CAFile="/etc/rsyslog.d/tls/ca.crt"
    StreamDriver.CertFile="/etc/rsyslog.d/tls/client.crt"
    StreamDriver.KeyFile="/etc/rsyslog.d/tls/client.key"

    # Buffer in memory, spilling to disk, and retry forever, so logs survive
    # the log server being down.
    queue.type="LinkedList"
    queue.filename="forward"
    queue.size="100000"
    queue.maxDiskSpace="1g"
    queue.saveOnShutdown="on"
    action.resumeRetryCount="-1"
    action.resumeInterval="10"
  )
}

# Everything else arriving in the default ruleset (journald, logger, ...).
call forward
